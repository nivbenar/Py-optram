[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoptram"
version = "0.1.0"
description = "Python implementation of the OPTRAM soil moisture model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "rasterio",
    "requests",
    "shapely",
    "s2rst==0.4.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    "*.ipynb",
    ".ipynb_checkpoints",
    ".pytest_cache",
    "*.egg-info",
    "build",
    "dist",
    "output",
    "pytest-temp*",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pyoptram"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyoptram*"]

[tool.setuptools.package-data]
pyoptram = ["evalscripts/*.js"]
