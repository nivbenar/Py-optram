[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoptram"
version = "0.1.0"
description = "Python implementation of the OPTRAM soil moisture model"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "geopandas",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "rasterio",
    "requests",
    "shapely",
    "s2rst==0.4.0",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyoptram*"]

[tool.setuptools.package-data]
pyoptram = ["evalscripts/*.js"]
